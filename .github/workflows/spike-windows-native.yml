# M0 spike:验证后端在原生 Windows 的安装/启动/测试(spec:Windows 原生移植)。
# 只手动触发;验证完成后随 spike 分支处置(合并进 M1 或删除),不挂任何自动 trigger。
name: spike-windows-native

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ST_EDITION: ce
      ST_CONTROL_PLANE_DSN: ""
      ST_REDIS_URL: ""
      ST_CELERY_BROKER_URL: ""
      ST_CELERY_RESULT_BACKEND: ""
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Probe 1 - uv sync (deps install on Windows)
        id: deps
        run: uv sync --group dev

      - name: Probe 2 - hermes-agent install + launch
        id: hermes
        continue-on-error: true
        run: |
          uv tool install "hermes-agent[acp]"
          hermes --version

      - name: Probe 3 - ffmpeg via choco
        id: ffmpeg
        continue-on-error: true
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: Probe 4 - pytest suite (default CE subset)
        id: tests
        continue-on-error: true
        run: uv run pytest -q --tb=line

      - name: Probe 5 - API boot + health check
        id: boot
        continue-on-error: true
        shell: pwsh
        run: |
          $proc = Start-Process -PassThru -NoNewWindow uv -ArgumentList "run","novelvideo","api","--host","127.0.0.1","--port","8780"
          $deadline = (Get-Date).AddSeconds(120)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8780/api/v1/config" -TimeoutSec 2 -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 2 }
            if ($proc.HasExited) { Write-Host "API process exited early, code $($proc.ExitCode)"; break }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { exit 1 }
          Write-Host "API healthy on native Windows"

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          @"
          ## Windows Native Spike Results
          | Probe | Outcome |
          |---|---|
          | deps (uv sync) | ${{ steps.deps.outcome }} |
          | hermes-agent | ${{ steps.hermes.outcome }} |
          | ffmpeg | ${{ steps.ffmpeg.outcome }} |
          | pytest | ${{ steps.tests.outcome }} |
          | API boot | ${{ steps.boot.outcome }} |
          "@ | Out-File -Append $env:GITHUB_STEP_SUMMARY
