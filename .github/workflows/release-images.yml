name: release-images
on:
  workflow_dispatch:
    inputs:
      acceptance_json:
        description: "Actual Compose acceptance receipt for isolated promotion measurement"
        required: true
        type: string
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71347f183eb13c76b93db0c3bf019e122f4f2fe6
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Validate and promote isolated accepted image indexes
        env:
          RECEIPT_JSON: ${{ inputs.acceptance_json }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, time
          pathlib.Path('receipt.json').write_text(os.environ['RECEIPT_JSON'])
          start = time.monotonic()
          subprocess.run([
              'python3', 'scripts/promote_release_images.py',
              '--receipt', 'receipt.json', '--release-tag', 'v2.1.3',
              '--source-sha', '71347f183eb13c76b93db0c3bf019e122f4f2fe6',
              '--benchmark', '--output', 'promotion.json',
          ], check=True)
          proof = {
              'ok': True, 'rebuilt': False,
              'source': '71347f183eb13c76b93db0c3bf019e122f4f2fe6',
              'totalSecondsIncludingValidation': round(time.monotonic() - start, 2),
              'method': 'GitHub Actions: full receipt/registry validation, isolated alias writes and digest readbacks',
          }
          pathlib.Path('promotion-timing.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: image-promotion-benchmark
          path: |
            promotion.json
            promotion-timing.json
          if-no-files-found: error
