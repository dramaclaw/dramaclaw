name: release-images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的 release tag(如 v1.0.2)"
        required: true
        type: string
      push_latest:
        description: "同时更新 latest tag(重建旧版本时保持关闭)"
        type: boolean
        default: false

permissions:
  contents: read

# release 事件取 tag 名(github.ref_name),手动触发取输入的 tag。
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: claymorelab/dramaclaw
          # release: latest=auto(prerelease 不推 latest);手动触发由 push_latest 决定,
          # 默认 false —— 重建历史版本时避免把 latest 回退到旧版。
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          flavor: |
            latest=${{ github.event_name == 'release' && 'auto' || (inputs.push_latest && 'true' || 'false') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: claymorelab/dramaclaw-frontend
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
          flavor: |
            latest=${{ github.event_name == 'release' && 'auto' || (inputs.push_latest && 'true' || 'false') }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_APP_VERSION=${{ env.RELEASE_TAG }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # 发版后把 docker-compose.release.yml 里的 DRAMACLAW_VERSION 默认值抬到刚发布的版本——开 PR，不直推 main。
  bump-compose-version:
    needs: [backend, frontend]
    if: ${{ github.event_name == 'release' }} # 手动重建旧版本不改 compose
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.COMPOSE_BUMP_TOKEN || github.token }}
      - name: Pin compose to the released version
        id: bump
        env:
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          if python3 scripts/bump_compose_default.py docker-compose.release.yml DRAMACLAW_VERSION "$ver" --check-only; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            rc=$?
            [ "$rc" = 3 ] && { echo "changed=false" >>"$GITHUB_OUTPUT"; exit 0; }
            exit "$rc"
          fi
          python3 scripts/bump_compose_default.py docker-compose.release.yml DRAMACLAW_VERSION "$ver"
      # 用内置 github.token 开的 PR 不会触发 pull_request CI，卡在必检项上无法合并；配了 COMPOSE_BUMP_TOKEN
      # （fine-grained PAT，本仓 contents + pull-requests write）就用它 push 和开 PR，CI 正常跑；没配则回退到 github.token，
      # 此时还需要仓库设置里的 "Allow GitHub Actions to create and approve pull requests" 打开，否则 gh pr create 会被拒绝。
      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COMPOSE_BUMP_TOKEN || github.token }}
          VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          branch="ci/pin-compose-${ver}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docker-compose.release.yml
          git commit -s -m "chore(compose): pin images to ${ver}" -m "Automated by release-images.yml after ${VERSION} images were published."
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(compose): pin images to ${ver}" --body "Automated: release ${VERSION} published claymorelab/dramaclaw{,-frontend}:${ver}; this pins docker-compose.release.yml to it."
