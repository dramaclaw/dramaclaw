name: pr-gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        id: setup_uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile
        id: lockfile
        run: uv lock --check

      - name: Install frozen dependencies
        id: sync
        run: uv sync --frozen

      - name: Validate Dependency Review policy
        id: dependency_review_config
        run: uv run python scripts/check_dependency_review_config.py

      - name: Validate Gate name uniqueness
        id: gate_uniqueness
        run: uv run python scripts/check_ci_gate_uniqueness.py

      - name: Validate Gate workflow policy
        id: workflow_policy
        run: uv run python scripts/check_ci_workflow_policy.py

      - name: Check port closure
        id: port_closure
        run: uv run python scripts/check_ce_port_closure.py

      - name: Lint
        id: ruff
        run: uv run ruff check --output-format=github .

      - name: Check installed dependency licenses
        id: dependency_licenses
        run: uv run python scripts/check_dependency_licenses.py

      - name: Run tests
        id: pytest
        run: uv run pytest -n auto

  ce-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint forbidden imports
        id: ce_imports
        run: python3 scripts/lint_ce_imports.py

      - name: Validate CE allowlist
        id: ce_allowlist
        run: python3 scripts/ce_allowlist.py

      - name: Lint forbidden package names
        id: ee_terms
        run: python3 scripts/lint_ee_terms.py

      - name: Lint banned words
        id: banned_words
        run: python3 scripts/lint_banned_words.py

  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.assert_path.outputs.verified }}
    steps:
      - name: Checkout
        id: checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review new dependency licenses
        id: review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

      - name: Dependency Review not applicable
        id: no_op
        if: github.event_name != 'pull_request'
        run: echo "Dependency Review applies to pull requests only."

      - name: Assert Dependency Review execution path
        id: assert_path
        if: always()
        env:
          APPLICABLE: ${{ github.event_name == 'pull_request' }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          NOOP_OUTCOME: ${{ steps.no_op.outcome }}
        run: |
          set -euo pipefail
          if [ "$APPLICABLE" = "true" ]; then
            [ "$CHECKOUT_OUTCOME" = "success" ]
            [ "$REVIEW_OUTCOME" = "success" ]
            [ "$NOOP_OUTCOME" = "skipped" ]
          elif [ "$APPLICABLE" = "false" ]; then
            [ "$CHECKOUT_OUTCOME" = "skipped" ]
            [ "$REVIEW_OUTCOME" = "skipped" ]
            [ "$NOOP_OUTCOME" = "success" ]
          else
            echo "::error::invalid Dependency Review applicability: $APPLICABLE"
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json

      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frozen dependencies
        id: install
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        id: build
        working-directory: frontend
        run: pnpm build

      - name: Unit tests
        id: test
        working-directory: frontend
        run: pnpm test

  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks binary
        id: install_gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ARCHIVE_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "$install_dir"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive" |
            sha256sum --check -
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan reachable git history
        id: scan
        run: gitleaks git . --log-opts="${{ github.sha }}" -c .gitleaks.toml --redact --no-banner --exit-code 1

  pr-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      verified: ${{ steps.assert_path.outputs.verified }}
    steps:
      - name: Checkout full history for DCO
        id: checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check DCO sign-off
        id: dco
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/check_dco.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: DCO not applicable
        id: no_op
        if: github.event_name != 'pull_request'
        run: echo "DCO applies to pull requests only."

      - name: Assert DCO execution path
        id: assert_path
        if: always()
        env:
          APPLICABLE: ${{ github.event_name == 'pull_request' }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          DCO_OUTCOME: ${{ steps.dco.outcome }}
          NOOP_OUTCOME: ${{ steps.no_op.outcome }}
        run: |
          set -euo pipefail
          if [ "$APPLICABLE" = "true" ]; then
            [ "$CHECKOUT_OUTCOME" = "success" ]
            [ "$DCO_OUTCOME" = "success" ]
            [ "$NOOP_OUTCOME" = "skipped" ]
          elif [ "$APPLICABLE" = "false" ]; then
            [ "$CHECKOUT_OUTCOME" = "skipped" ]
            [ "$DCO_OUTCOME" = "skipped" ]
            [ "$NOOP_OUTCOME" = "success" ]
          else
            echo "::error::invalid DCO applicability: $APPLICABLE"
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

  gate:
    name: dramaclaw-pr-gate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - backend
      - ce-policy
      - dependency-review
      - frontend
      - secret-scan
      - pr-policy
    steps:
      - name: Verify all required jobs passed
        id: verify
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq .
          printf '%s\n' "$NEEDS_JSON" |
            jq -e '
              all(.[]; .result == "success") and
              ."dependency-review".outputs.verified == "true" and
              ."pr-policy".outputs.verified == "true"
            '
