# Release 时构建 Windows/macOS 便携包并挂到 GitHub Release 资产。
# 打包配方与 docs 中的原生移植验收一致:python-build-standalone + uv --target
# 依赖环境(world 走 uv export 锁定清单,绕开 da2 元数据钉版冲突)+ 内置
# Node/splat-transform + ffmpeg + 前端产物 + deploy/portable 启停脚本。
# 模型权重不入包(Apple 研究许可,运行时自 HF 下载)。
name: release-packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要打包的 release tag(如 v1.0.2)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # 与真机验收一致的固定版本;升级需重新过双平台冒烟
  PBS_RELEASE: "20260623"
  PBS_PYTHON: "3.12.13"
  NODE_VERSION: "v24.18.0"

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $pkg = "$PWD\dist-pkg\DramaClaw-win64"
          New-Item -ItemType Directory -Force -Path "$pkg\runtime" | Out-Null

          # 1. runtime python(python-build-standalone install_only)
          $pyUrl = "https://github.com/astral-sh/python-build-standalone/releases/download/$env:PBS_RELEASE/cpython-$env:PBS_PYTHON%2B$env:PBS_RELEASE-x86_64-pc-windows-msvc-install_only.tar.gz"
          Invoke-WebRequest -Uri $pyUrl -OutFile python.tar.gz
          tar -xzf python.tar.gz -C "$pkg\runtime"
          & "$pkg\runtime\python\python.exe" -V

          # VC++ 运行库随包(greenlet 等 C++ 扩展依赖;干净机器无 redist)
          Copy-Item C:\Windows\System32\msvcp140.dll, C:\Windows\System32\msvcp140_1.dll, C:\Windows\System32\msvcp140_2.dll, C:\Windows\System32\msvcp140_atomic_wait.dll, C:\Windows\System32\msvcp140_codecvt_ids.dll, C:\Windows\System32\concrt140.dll "$pkg\runtime\python\" -Force

          # 2. 应用依赖环境:world 用 uv export 的锁定清单(--no-deps),再装自身 wheel
          uv export --extra world --no-dev --no-emit-project --no-hashes -o world-reqs.txt
          uv build --wheel -o dist-wheel
          $wheel = (Get-ChildItem dist-wheel -Filter *.whl | Select-Object -First 1).FullName
          uv pip install --python "$pkg\runtime\python\python.exe" --target "$pkg\runtime\env" --no-deps -r world-reqs.txt
          uv pip install --python "$pkg\runtime\python\python.exe" --target "$pkg\runtime\env" --no-deps $wheel

          # 3. hermes 独立环境
          uv pip install --python "$pkg\runtime\python\python.exe" --target "$pkg\runtime\hermes" "hermes-agent[acp]"

          # 4. ffmpeg(BtbN LGPL win64)
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x -Force
          New-Item -ItemType Directory -Force -Path "$pkg\runtime\ffmpeg" | Out-Null
          Copy-Item ffmpeg-x\*\bin\*.exe "$pkg\runtime\ffmpeg\" -Force

          # 5. Node + splat-transform(PLY->SOG)
          Invoke-WebRequest -Uri "https://nodejs.org/dist/$env:NODE_VERSION/node-$env:NODE_VERSION-win-x64.zip" -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-x -Force
          Move-Item (Get-ChildItem node-x | Select-Object -First 1).FullName "$pkg\runtime\node"
          cmd /c "set PATH=$pkg\runtime\node;%PATH%&& $pkg\runtime\node\npm.cmd install -g @playcanvas/splat-transform"

          # 6. 前端产物 + 启停脚本
          Copy-Item -Recurse frontend\dist "$pkg\frontend"
          Copy-Item deploy\portable\windows\DramaClaw-Start.bat, deploy\portable\windows\DramaClaw-Stop.bat, deploy\portable\windows\_stop.ps1, deploy\portable\windows\README-Windows.txt "$pkg\" -Force

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "$PWD\dist-pkg\DramaClaw-win64"
          $env:ST_EDITION = "ce"; $env:ST_CONTROL_PLANE_DSN = ""; $env:ST_REDIS_URL = ""
          $env:ST_CELERY_BROKER_URL = ""; $env:ST_CELERY_RESULT_BACKEND = ""
          $env:NOVELVIDEO_DATA_ROOT = "$PWD\smoke-data"; $env:NOVELVIDEO_STATE_DIR = "$PWD\smoke-data\state"; $env:NOVELVIDEO_OUTPUT_DIR = "$PWD\smoke-data\output"
          $env:PYTHONPATH = "$pkg\runtime\env;$pkg\runtime\env\win32;$pkg\runtime\env\win32\lib;$pkg\runtime\env\Pythonwin"
          $env:DRAMACLAW_FRONTEND_DIST = "$pkg\frontend"; $env:PYTHONUTF8 = "1"
          $proc = Start-Process -PassThru -NoNewWindow "$pkg\runtime\python\python.exe" -ArgumentList '-c','import sys; from novelvideo.cli import app; sys.exit(app())','api','--host','127.0.0.1','--port','8780'
          $deadline = (Get-Date).AddSeconds(180); $ok = $false
          while ((Get-Date) -lt $deadline) {
            try { $r = Invoke-WebRequest -Uri http://127.0.0.1:8780/api/v1/config -TimeoutSec 2 -UseBasicParsing; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 3 }
            if ($proc.HasExited) { throw "api process exited early" }
          }
          if (-not $ok) { throw "api not healthy" }
          $spa = Invoke-WebRequest -Uri http://127.0.0.1:8780/ -UseBasicParsing
          if ($spa.StatusCode -ne 200) { throw "spa root failed" }
          # SPA 深链接回落(评审修复的契约)
          $deep = Invoke-WebRequest -Uri http://127.0.0.1:8780/projects/smoke -UseBasicParsing
          if ($deep.StatusCode -ne 200) { throw "spa deep-link fallback failed" }
          Stop-Process -Id $proc.Id -Force

      - name: Zip and upload release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "DramaClaw-win64-portable-$env:RELEASE_TAG.zip"
          cmd /c "cd /d dist-pkg && tar -a -c -f ..\$zip DramaClaw-win64"
          gh release upload $env:RELEASE_TAG $zip --clobber

  macos-package:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          cd frontend
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble package
        run: |
          set -euo pipefail
          pkg="$PWD/dist-pkg/DramaClaw-macos-arm64"
          mkdir -p "$pkg/runtime"

          curl -sL -o python.tar.gz "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/cpython-${PBS_PYTHON}%2B${PBS_RELEASE}-aarch64-apple-darwin-install_only.tar.gz"
          tar -xzf python.tar.gz -C "$pkg/runtime"
          "$pkg/runtime/python/bin/python3" -V

          uv export --extra world --no-dev --no-emit-project --no-hashes -o world-reqs.txt
          uv build --wheel -o dist-wheel
          uv pip install --python "$pkg/runtime/python/bin/python3" --target "$pkg/runtime/env" --no-deps -r world-reqs.txt
          uv pip install --python "$pkg/runtime/python/bin/python3" --target "$pkg/runtime/env" --no-deps dist-wheel/*.whl

          uv pip install --python "$pkg/runtime/python/bin/python3" --target "$pkg/runtime/hermes" "hermes-agent[acp]"

          mkdir -p "$pkg/runtime/ffmpeg"
          curl -sL -o ffmpeg.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -sL -o ffprobe.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -o -q ffmpeg.zip -d "$pkg/runtime/ffmpeg/"
          unzip -o -q ffprobe.zip -d "$pkg/runtime/ffmpeg/"
          chmod +x "$pkg/runtime/ffmpeg/ffmpeg" "$pkg/runtime/ffmpeg/ffprobe"

          curl -sL -o node.tar.gz "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-arm64.tar.gz"
          mkdir -p "$pkg/runtime/node"
          tar -xzf node.tar.gz -C "$pkg/runtime/node" --strip-components 1
          PATH="$pkg/runtime/node/bin:$PATH" "$pkg/runtime/node/bin/npm" install -g @playcanvas/splat-transform --silent

          cp -R frontend/dist "$pkg/frontend"
          cp deploy/portable/macos/DramaClaw-Start.command deploy/portable/macos/DramaClaw-Stop.command deploy/portable/macos/README-macOS.txt "$pkg/"
          chmod +x "$pkg/DramaClaw-Start.command" "$pkg/DramaClaw-Stop.command"

      - name: Smoke test
        run: |
          set -euo pipefail
          pkg="$PWD/dist-pkg/DramaClaw-macos-arm64"
          export ST_EDITION=ce ST_CONTROL_PLANE_DSN= ST_REDIS_URL= ST_CELERY_BROKER_URL= ST_CELERY_RESULT_BACKEND=
          export NOVELVIDEO_DATA_ROOT="$PWD/smoke-data" NOVELVIDEO_STATE_DIR="$PWD/smoke-data/state" NOVELVIDEO_OUTPUT_DIR="$PWD/smoke-data/output"
          export PYTHONPATH="$pkg/runtime/env" DRAMACLAW_FRONTEND_DIST="$pkg/frontend" PYTHONUTF8=1
          "$pkg/runtime/python/bin/python3" -c "import sys; from novelvideo.cli import app; sys.exit(app())" api --host 127.0.0.1 --port 8780 &
          server=$!
          for _ in $(seq 1 60); do
            curl -fsS -m 2 http://127.0.0.1:8780/api/v1/config >/dev/null 2>&1 && break
            kill -0 "$server" || { echo "api exited early"; exit 1; }
            sleep 3
          done
          curl -fsS http://127.0.0.1:8780/api/v1/config >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/)" = "200" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8780/projects/smoke)" = "200" ]
          kill "$server"

      - name: Zip and upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist-pkg
          zip -qry "../DramaClaw-macos-arm64-portable-${RELEASE_TAG}.zip" DramaClaw-macos-arm64
          cd ..
          gh release upload "$RELEASE_TAG" "DramaClaw-macos-arm64-portable-${RELEASE_TAG}.zip" --clobber
