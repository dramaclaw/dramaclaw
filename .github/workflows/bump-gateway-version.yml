name: bump-gateway-version

# 网关是独立仓库（dramaclaw/dramaclaw-gateway 公开 fork），发版不经过本仓的 release 事件，
# 所以用定时轮询 + 手动触发去发现新 Release，再把默认值抬到 docker-compose.release.yml——开 PR，不直推 main。
on:
  schedule:
    - cron: "17 2 * * *" # 每天 UTC 02:17
  workflow_dispatch:
    inputs:
      tag:
        description: "指定网关 tag（留空取 dramaclaw/dramaclaw-gateway 最新 -dramaclaw.N Release）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.COMPOSE_BUMP_TOKEN || github.token }}
      - name: Resolve latest gateway release
        id: gw
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(gh release list -R dramaclaw/dramaclaw-gateway -L 50 --json tagName,isDraft --jq '[.[] | select(.isDraft==false) | .tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?-dramaclaw\\.[0-9]+$"))] | first')
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?-dramaclaw\.[0-9]+$ ]] || { echo "::error::no valid gateway tag ($tag)"; exit 1; }
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
      - name: Bump default
        id: bump
        env:
          TAG: ${{ steps.gw.outputs.tag }}
        run: |
          set -euo pipefail
          if python3 scripts/bump_compose_default.py docker-compose.release.yml DRAMACLAW_GATEWAY_VERSION "$TAG" --check-only; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
            python3 scripts/bump_compose_default.py docker-compose.release.yml DRAMACLAW_GATEWAY_VERSION "$TAG"
          else
            rc=$?
            [ "$rc" = 3 ] && { echo "changed=false" >>"$GITHUB_OUTPUT"; exit 0; }
            exit "$rc"
          fi
      # 用内置 github.token 开的 PR 不会触发 pull_request CI，卡在必检项上无法合并；配了 COMPOSE_BUMP_TOKEN
      # （fine-grained PAT，本仓 contents + pull-requests write）就用它 push 和开 PR，CI 正常跑；没配则回退到 github.token，
      # 此时还需要仓库设置里的 "Allow GitHub Actions to create and approve pull requests" 打开，否则 gh pr create 会被拒绝。
      - name: Open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.COMPOSE_BUMP_TOKEN || github.token }}
          TAG: ${{ steps.gw.outputs.tag }}
        run: |
          set -euo pipefail
          branch="ci/bump-gateway-${TAG}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "PR branch exists, skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docker-compose.release.yml
          git commit -s -m "chore(compose): bump bundled gateway to ${TAG}" -m "Automated: dramaclaw/dramaclaw-gateway published ${TAG}."
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(compose): bump bundled gateway to ${TAG}" --body "Automated by bump-gateway-version.yml. Image: claymorelab/dramaclaw-gateway:${TAG}."
