name: Canvas command push native acceptance

on:
  pull_request:
    paths:
      - 'src/novelvideo/freezone/canvas_command_*.py'
      - 'src/novelvideo/utils/async_ops.py'
      - 'tests/test_canvas_command_push.py'
      - '.github/workflows/canvas-command-push.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated component-test dependencies
        run: >-
          python -m pip install watchfiles==1.1.1 anyio==4.12.0
          portalocker==3.2.0 rich==14.3.3 pytest==9.0.2 pytest-asyncio==1.3.0
      - name: Run native cross-process and recovery acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHON_DOTENV_DISABLED: '1'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p canvas-push-acceptance
          cp "$GITHUB_WORKSPACE/tests/test_canvas_command_push.py" canvas-push-acceptance/
          python -m pytest -q -s -o asyncio_mode=auto canvas-push-acceptance/
