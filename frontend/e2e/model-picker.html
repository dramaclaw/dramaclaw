<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body>
    <main id="picker-fixture" style="position: fixed; left: 16px"></main>
    <script type="module">
      import React from 'react';
      import { createRoot } from 'react-dom/client';
      import '/src/index.css';
      import { ProviderModelPicker } from '/src/features/canvas/ui/ProviderModelPicker.tsx';

      const params = new URLSearchParams(location.search);
      const placement = params.get('placement');
      const root = document.getElementById('picker-fixture');
      root.style[placement === 'top' ? 'bottom' : 'top'] = '16px';
      document.documentElement.classList.toggle('dark', params.get('theme') === 'dark');
      const models = Array.from({length: Number(params.get('count'))}, (_, i) => ({
        id: String(i), apiModel: String(i), providerId: 'newapi', label: 'Model ' + i,
        pickerGuide: i % 2 === 1 || (i === 0 && params.has('firstGuide'))
          ? {en: {summary: 'Short summary', detail: 'Preview for model ' + i}} : undefined,
      }));
      if (params.has('longGuide')) models.at(-1).pickerGuide.en.detail =
        'A longer description of the model and its constraints. '.repeat(16) + 'End of guide';
      const grouped = params.get('grouped');
      const imageModels = models.map(m => ({...m, displayName: m.label, guideData: m}));
      const ratio = {value: '1:1', label: '1:1'}, size = {value: '2K', label: '2K'};
      if (grouped === 'inline') Object.assign(root.style, {transform: 'scale(0.8)', transformOrigin: 'bottom left'});
      const picker = grouped ? React.createElement((await import('/src/features/canvas/ui/ModelParamsControls.tsx')).ModelParamsControls, {
        imageModels, selectedModel: imageModels[0], resolutionOptions: [size], selectedResolution: size,
        selectedAspectRatio: ratio, aspectRatioOptions: [ratio], modelPanelAlign: 'start',
        panelRenderMode: grouped, showProviderName: false, onModelChange() {}, onResolutionChange() {}, onAspectRatioChange() {},
      }) : React.createElement(ProviderModelPicker, {
        models, domain: params.get('domain'), selectedModelId: '0', popoverPlacement: placement,
        onChange: () => {},
      });
      if (params.has('canvas')) {
        const {ReactFlow} = await import('@xyflow/react');
        await import('@xyflow/react/dist/style.css');
        Object.assign(root.style, {inset: '0', width: '100vw', height: '100vh'});
        const PickerNode = () => React.createElement('div', {style: {width: '430px'}},
          React.createElement('div', {className: 'drag-handle'}, 'Drag node'),
          React.createElement('div', {className: 'nodrag'}, picker));
        createRoot(root).render(React.createElement(ReactFlow, {
          defaultNodes: [{id: 'picker', type: 'picker', position: {x: 420, y: 530}, dragHandle: '.drag-handle'}],
          nodeTypes: {picker: PickerNode}, defaultEdges: [], proOptions: {hideAttribution: true},
        }));
      } else {
        createRoot(root).render(picker);
      }
    </script>
  </body>
</html>
